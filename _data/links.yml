# Homepage link cards, in display order.
#   label  card text
#   icon   file in _includes/icons/ (without .svg)
#   url    link target; paths starting with / are site-relative
#   email  true links to mailto:<site.email> instead of url
#   title  optional tooltip
#   rel    optional rel attribute
#   dos    size and date columns in the DOS theme's DIR listing, padded so they line up after the label
# Profile URLs are also listed under social.links in _config.yml, for jekyll-seo-tag and the homepage JSON-LD.


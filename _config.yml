# Site settings
title: Jacob Quatier
tagline: Software Engineer
email: jacobquatier@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Jacob Quatier is a software engineer based in Portland, Oregon.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.jacobquatier.com" # the base hostname & protocol for your site
permalink: /:title/
lang: en_US

# sitewide default social share image (jekyll-seo-tag reads `image` per-page,
# so it's set here via front matter defaults rather than a top-level key)
defaults:
  - scope:
      path: ""
    values:
      image: /img/og-card.png

# author / social settings (read by jekyll-seo-tag and site templates)
author:
  name: Jacob Quatier
  twitter: jquatier
twitter:
  username: jquatier
  card: summary_large_image
social:
  name: Jacob Quatier
  links:
    - https://github.com/jquatier
    - https://www.linkedin.com/in/jacobquatier
    - https://twitter.com/jquatier
logo: /img/og-card.png

# google analytics 4 measurement id (rendered by _includes/google-analytics.html,
# production builds only)
google_analytics: G-CXEKR6CQYJ

# search console ownership verification (rendered by jekyll-seo-tag)
webmaster_verifications:
  google: 2KT4I-DM-QzBqqgLm55OcUcbLPAKGrQRnjjpVc-LxHw

# this site is fully custom-styled; disable the GitHub Pages default theme
theme: null

# Build settings
markdown: kramdown

# css/main.scss pulls in the partials under _sass/; keep the output readable for view-source
sass:
  style: expanded

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
